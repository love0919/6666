name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o "外送助手Pro_Android專案.zip" -d android_project

      - name: Find project
        run: |
          echo "Searching Android project..."
          find android_project -maxdepth 3 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "gradlew" \)

      - name: Build APK
        run: |
          cd android_project
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "gradlew not found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 外送助手Pro-APK
          path: android_project/**/build/outputs/apk/**/*.apk
