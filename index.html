<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Uber Eats 計時器</title>
    <style>
        :root {
            --bg: #000000;
            --card: #161616;
            --ue-green: #06C167;
            --red: #FF2E00;
            --text: #FFFFFF;
            --dim: #A0A0A0;
            --border: #2A2A2A;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            width: 100%;
            min-height: 100dvh;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 12px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title { font-size: 20px; font-weight: 900; color: var(--ue-green); }

        .tab-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .control-panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .stepper {
            display: flex;
            align-items: center;
            background: #222;
            border-radius: 8px;
            padding: 2px;
        }

        .step-btn {
            width: 44px;
            height: 44px;
            background: var(--ue-green);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 24px;
            font-weight: bold;
        }

        .step-val {
            width: 32px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        input[type="number"] {
            flex: 1;
            min-width: 0;
            height: 44px;
            background: #222;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            outline: none;
        }

        .start-btn {
            height: 44px;
            padding: 0 16px;
            background: var(--ue-green);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 900;
            white-space: nowrap;
        }

        .timer-card {
            background: var(--card);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 5px solid var(--ue-green);
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .batch-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--dim);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .timer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        .timer-row:last-child { border-bottom: none; }

        .tag-ue {
            background: var(--ue-green);
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 900;
            margin-right: 6px;
        }

        .time-text { font-size: 15px; font-weight: bold; }

        .stop-btn {
            height: 40px;
            padding: 0 14px;
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
        }

        .batch-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .batch-head {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <span class="title" id="page-title">Uber Eats 計時器</span>
            <button class="tab-btn" onclick="toggleView()">歷史紀錄</button>
        </div>

        <div id="timer-view">
            <div class="control-panel">
                <div class="stepper">
                    <button class="step-btn" onclick="adjustCount(-1)">-</button>
                    <span class="step-val" id="order-count">3</span>
                    <button class="step-btn" onclick="adjustCount(1)">+</button>
                </div>
                <input type="number" id="platform-pay" placeholder="$金額" inputmode="decimal">
                <button class="start-btn" onclick="startTimer()">開始</button>
            </div>

            <div id="active-timers-list" style="margin-top: 10px;">
                <div style="text-align:center;color:var(--dim);padding:30px 0;font-size:16px;">無進行中訂單</div>
            </div>
        </div>

        <div id="history-view" style="display: none;">
            <div id="history-container"></div>
        </div>
    </div>

    <script>
        let count = 3;
        let activeBatches = [];
        let historyBatches = JSON.parse(localStorage.getItem('order_history') || '[]');

        function adjustCount(delta) {
            count = Math.max(1, Math.min(5, count + delta));
            document.getElementById('order-count').innerText = count;
        }

        function fmt(d) {
            const date = new Date(d);
            return `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
        }

        function startTimer() {
            const payInput = document.getElementById('platform-pay');
            const pay = parseFloat(payInput.value) || 0;
            const now = new Date();
            
            activeBatches.push({
                id: Date.now(),
                startTime: now,
                platformPay: pay,
                orders: Array.from({ length: count }, (_, i) => ({
                    id: i + 1,
                    startTime: now,
                    endTime: null,
                    durationMin: 0
                }))
            });

            payInput.value = '';
            renderActive();
        }

        function stopOrder(bId, idx) {
            const batch = activeBatches.find(b => b.id === bId);
            if (!batch) return;
            
            const o = batch.orders[idx];
            o.endTime = new Date();
            o.durationMin = Math.max(1, Math.round((o.endTime - o.startTime) / 60000));

            if (batch.orders.every(item => item.endTime !== null)) {
                let totalEst = 0;
                batch.orders.forEach(item => {
                    item.estPay = parseFloat((item.durationMin * 4.086).toFixed(1));
                    totalEst += item.estPay;
                });
                
                historyBatches.unshift({
                    ...batch,
                    totalEstPay: totalEst.toFixed(1),
                    diff: (batch.platformPay - totalEst).toFixed(1)
                });
                
                localStorage.setItem('order_history', JSON.stringify(historyBatches));
                activeBatches = activeBatches.filter(b => b.id !== bId);
            }
            renderActive();
        }

        function renderActive() {
            const activeList = document.getElementById('active-timers-list');
            if (!activeBatches.length) {
                activeList.innerHTML = `<div style="text-align:center;color:var(--dim);padding:30px 0;font-size:16px;">無進行中訂單</div>`;
                return;
            }

            activeList.innerHTML = activeBatches.map(b => `
                <div class="timer-card">
                    <div class="batch-info">
                        <span>開單 ${fmt(b.startTime)}</span>
                        <span>平台 $${b.platformPay}</span>
                    </div>
                    ${b.orders.map((o, idx) => `
                        <div class="timer-row">
                            <div>
                                <span class="tag-ue">UE</span>
                                <span class="time-text">${fmt(o.startTime)}</span>
                            </div>
                            <div id="time-${b.id}-${idx}" class="time-text" style="color:var(--ue-green);">
                                ${o.endTime ? ${o.durationMin}分 : '0分 0秒'}
                            </div>
                            ${!o.endTime ? 
                                <button class="stop-btn" onclick="stopOrder(${b.id}, ${idx})">送達</button> : 
                                '<span style="color:var(--ue-green);font-size:14px;font-weight:bold;">✓ 完成</span>'
                            }
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        function toggleView() {
            const timerView = document
