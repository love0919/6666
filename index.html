<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>機車外送計時器</title>
    <style>
        :root {
            --bg: #0d0f12;
            --card: #181b20;
            --orange: #ff7600;
            --green: #00e676;
            --red: #ff334b;
            --text: #ffffff;
            --dim: #8a92a0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        .title { font-size: 22px; font-weight: 900; color: var(--orange); }

        .tab-btn {
            background: var(--card);
            border: 1px solid #2a2e37;
            color: var(--text);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
        }

        .control-panel {
            background: var(--card);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .stepper {
            display: flex;
            align-items: center;
            background: #22262f;
            border-radius: 12px;
            padding: 4px;
        }

        .step-btn {
            width: 48px;
            height: 48px;
            background: var(--orange);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 28px;
            font-weight: bold;
        }

        .step-val {
            width: 36px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        input[type="number"] {
            flex: 1;
            height: 56px;
            background: #22262f;
            border: none;
            border-radius: 12px;
            color: var(--text);
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            outline: none;
        }

        .start-btn {
            height: 56px;
            padding: 0 20px;
            background: var(--orange);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 900;
        }

        .timer-card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 6px solid var(--orange);
        }

        .batch-info {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            color: var(--dim);
            margin-bottom: 12px;
            font-weight: bold;
        }

        .timer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #282c35;
        }

        .timer-row:last-child { border-bottom: none; }

        .tag-ue {
            background: var(--green);
            color: #000;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 900;
            margin-right: 6px;
        }

        .time-text { font-size: 18px; font-weight: bold; }

        .stop-btn {
            height: 48px;
            padding: 0 16px;
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
        }

        .done-text { color: var(--green); font-size: 16px; font-weight: bold; }

        .batch-card {
            background: var(--card);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .batch-head {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <span class="title" id="page-title">機車計時器</span>
            <button class="tab-btn" id="toggle-btn">歷史紀錄</button>
        </div>

        <div id="timer-view">
            <div class="control-panel">
                <div class="stepper">
                    <button class="step-btn" id="btn-minus">-</button>
                    <span class="step-val" id="order-count">3</span>
                    <button class="step-btn" id="btn-plus">+</button>
                </div>
                <input type="number" id="platform-pay" placeholder="$平台金額" inputmode="decimal">
                <button class="start-btn" id="btn-start">開始</button>
            </div>

            <div id="active-timers-list" style="margin-top: 12px;"></div>
        </div>

        <div id="history-view" style="display: none;">
            <div id="history-container"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let count = 3;
            let activeBatches = [];
            let historyBatches = JSON.parse(localStorage.getItem('order_history') || '[]');

            const countEl = document.getElementById('order-count');
            const payInput = document.getElementById('platform-pay');
            const activeList = document.getElementById('active-timers-list');
            const timerView = document.getElementById('timer-view');
            const historyView = document.getElementById('history-view');
            const toggleBtn = document.getElementById('toggle-btn');
            const pageTitle = document.getElementById('page-title');

            document.getElementById('btn-minus').onclick = () => { if(count > 1) countEl.innerText = --count; };
            document.getElementById('btn-plus').onclick = () => { if(count < 5) countEl.innerText = ++count; };

            document.getElementById('btn-start').onclick = () => {
                const pay = parseFloat(payInput.value) || 0;
                const now = new Date();
                activeBatches.push({
                    id: Date.now(),
                    startTime: now,
                    platformPay: pay,
                    orders: Array.from({ length: count }, (_, i) => ({
                        id: i + 1, startTime: now, endTime: null, durationMin: 0
                    }))
                });
                payInput.value = '';
                renderActive();
            };

            toggleBtn.onclick = () => {
                const isTimer = timerView.style.display !== 'none';
                timerView.style.display = isTimer ? 'none' : 'block';
                historyView.style.display = isTimer ? 'block' : 'none';
                pageTitle.innerText = isTimer ? '歷史對照' : '機車計時器';
                toggleBtn.innerText = isTimer ? '返回計時' : '歷史紀錄';
                if (isTimer) renderHistory();
            };

            function fmt(d) { return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

            function renderActive() {
                if (!activeBatches.length) {
                    activeList.innerHTML = `<div style="text-align:center;color:var(--dim);padding:40px 0;font-size:18px;">無進行中訂單</div>`;
                    return;
                }

                activeList.innerHTML = activeBatches.map(b => `
                    <div class="timer-card">
                        <div class="batch-info">
                            <span>開單 ${fmt(b.startTime)}</span>
                            <span>平台 $${b.platformPay}</span>
                        </div>
                        ${b.orders.map((o, idx) => `
                            <div class="timer-row">
                                <div>
                                    <span class="tag-ue">UE</span>
                                    <span class="time-text">${fmt(o.startTime)}</span>
                                </div>
                                <div id="time-${b.id}-${idx}" class="time-text" style="color:var(--orange);">
                                    ${o.endTime ? ${o.durationMin}分 : '0分 0秒'}
                                </div>
                                ${!o.endTime ? 
                                    <button class="stop-btn" data-b="${b.id}" data-i="${idx}">送達</button> : 
                                    '<span class="done-text">✓ 完成</span>'
                                }
                            </div>
                        `).join('')}
                    </div>
                `).join('');

                document.querySelectorAll('.stop-btn').forEach(btn => {
                    btn.onclick = (e) => stopOrder(parseInt(e.target.dataset.b), parseInt(e.target.dataset.i));
                });
            }

            function stopOrder(bId, idx) {
                const batch = activeBatches.find(b => b.id === bId);
                if (!batch) return;
                const o = batch.orders[idx];
                o.endTime = new Date();
                o.durationMin = Math.max(1, Math.round((o.endTime - o.startTime) / 60000));
