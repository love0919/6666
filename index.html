<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Uber Eats 計時器</title>
    <style>
        :root {
            --bg: #000000;
            --card: #161616;
            --ue-green: #06C167;
            --red: #FF2E00;
            --text: #FFFFFF;
            --dim: #A0A0A0;
            --border: #2A2A2A;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            min-height: 100dvh;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 12px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title { font-size: 20px; font-weight: 900; color: var(--ue-green); }

        .tab-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .control-panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .stepper {
            display: flex;
            align-items: center;
            background: #222;
            border-radius: 8px;
            padding: 2px;
        }

        .step-btn {
            width: 44px;
            height: 44px;
            background: var(--ue-green);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        .step-val {
            width: 32px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        input[type="number"] {
            flex: 1;
            min-width: 0;
            height: 44px;
            background: #222;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            outline: none;
        }

        .start-btn {
            height: 44px;
            padding: 0 16px;
            background: var(--ue-green);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 900;
            white-space: nowrap;
            cursor: pointer;
        }

        .timer-card {
            background: var(--card);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 5px solid var(--ue-green);
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .batch-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--dim);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .timer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        .timer-row:last-child { border-bottom: none; }

        .tag-ue {
            background: var(--ue-green);
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 900;
            margin-right: 6px;
        }

        .time-text { font-size: 15px; font-weight: bold; }

        .stop-btn {
            height: 40px;
            padding: 0 14px;
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .batch-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .batch-head {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <span class="title" id="page-title">Uber Eats 計時器</span>
            <button class="tab-btn" type="button" onclick="toggleView()">歷史紀錄</button>
        </div>

        <div id="timer-view">
            <div class="control-panel">
                <div class="stepper">
                    <button class="step-btn" type="button" onclick="adjustCount(-1)">-</button>
                    <span class="step-val" id="order-count">3</span>
                    <button class="step-btn" type="button" onclick="adjustCount(1)">+</button>
                </div>
                <input type="number" id="platform-pay" placeholder="$金額" inputmode="decimal">
                <button class="start-btn" type="button" onclick="startTimer()">開始</button>
            </div>

            <div id="active-timers-list" style="margin-top: 10px;">
                <div style="text-align:center;color:var(--dim);padding:30px 0;font-size:16px;">無進行中訂單</div>
            </div>
        </div>

        <div id="history-view" style="display: none;">
            <div id="history-container"></div>
        </div>
    </div>

    <script>
        var count = 3;
        var activeBatches = [];
        var historyBatches = JSON.parse(localStorage.getItem('order_history') || '[]');

        function adjustCount(delta) {
            count = Math.max(1, Math.min(5, count + delta));
            document.getElementById('order-count').innerText = count;
        }

        function fmt(d) {
            var date = new Date(d);
            var h = date.getHours();
            var m = date.getMinutes();
            return (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
        }

        function startTimer() {
            var payInput = document.getElementById('platform-pay');
            var pay = parseFloat(payInput.value) || 0;
            var now = new Date();
            
            var orders = [];
            for (var i = 0; i < count; i++) {
                orders.push({
                    id: i + 1,
                    startTime: now,
                    endTime: null,
                    durationMin: 0
                });
            }

            activeBatches.push({
                id: Date.now(),
                startTime: now,
                platformPay: pay,
                orders: orders
            });

            payInput.value = '';
            renderActive();
        }

        function stopOrder(bId, idx) {
            var batch = null;
            for (var i = 0; i < activeBatches.length; i++) {
                if (activeBatches[i].id === bId) {
                    batch = activeBatches[i];
                    break;
                }
            }
            if (!batch) return;
            
            var o = batch.orders[idx];
            o.endTime = new Date();
            o.durationMin = Math.max(1, Math.round((o.endTime - o.startTime) / 60000));

            var allDone = true;
            for (var j = 0; j < batch.orders.length; j++) {
                if (batch.orders[j].endTime === null) {
                    allDone = false;
                    break;
                }
            }

            if (allDone) {
                var totalEst = 0;
                for (var k = 0; k < batch.orders.length; k++) {
                    batch.orders[k].estPay = parseFloat((batch.orders[k].durationMin * 4.086).toFixed(1));
                    totalEst += batch.orders[k].estPay;
                }
                
                historyBatches.unshift({
                    id: batch.id,
                    startTime: batch.startTime,
                    platformPay: batch.platformPay,
                    orders: batch.orders,
                    totalEstPay: totalEst.toFixed(1),
                    diff: (batch.platformPay - totalEst).toFixed(1)
                });
                
                localStorage.setItem('order_history', JSON.stringify(historyBatches));
                
                var newActive = [];
                for (var m = 0; m < activeBatches.length; m++) {
                    if (activeBatches[m].id !== bId) {
                        newActive.push(activeBatches[m]);
                    }
                }
                activeBatches = newActive;
            }
            renderActive();
        }

        function renderActive() {
            var activeList = document.getElementById('active-timers-list');
            if (activeBatches.length === 0) {
                activeList.innerHTML = '<div style="text-align:center;color:var(--dim);padding:30px 0;font-size:16px;">無進行中訂單</div>';
                return;
            }

            var html = '';
            for (var i = 0; i < activeBatches.length; i++) {
                var b = activeBatches[i];
                html += '<div class="timer-card">';
                html += '<div class="batch-info"><span>開單 ' + fmt(b.startTime) +
